<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Tour of Taita Taveta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <div class="nav-inner">
    <div class="brand"><img src="../logos/taita-taveta.png" alt="Tour of Taita Taveta Logo" class="main-logo"></div>
    <nav class="links">
      <a href="../index.html#home">Home</a>
      <a href="register.html">Register</a>
    </nav>
  </div>
</header>

<section class="region-hero">
  <h1>Log In</h1>
  <div class="meta">Access your TTTT account</div>
</section>

<main>
  <section style="max-width:480px;margin:0 auto;">
    <form id="login-form" novalidate>
      <div class="field"><label for="email">Email address</label><input type="email" id="email" required></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" required></div>
      <button type="submit" class="submit" id="login-btn">Log In</button>
      <div class="status-msg" id="login-status"></div>
    </form>
    <p class="fine-print" style="text-align:center;margin-top:1rem;">
      No account yet? <a href="register.html" style="color:var(--accent-deep);">Register here</a>
    </p>
  </section>
</main>

<footer>
  <p><strong>Tour of Taita Taveta</strong> — Attitude meets Altitude.</p>
  <p>&copy; 2026 Tour of Taita Taveta. All rights reserved.</p>
</footer>

<script src="../assets/js/account.js"></script>
<script>
  const form = document.getElementById('login-form');
  const status = document.getElementById('login-status');
  const btn = document.getElementById('login-btn');

  function showStatus(kind, text) {
    status.className = 'status-msg show ' + kind;
    status.textContent = text;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Logging in…';
    const result = await ttttAccount.login(
      document.getElementById('email').value.trim(),
      document.getElementById('password').value
    );
    if (result.success) {
      window.location.href = 'dashboard.html';
    } else {
      showStatus('error', result.error || 'Login failed.');
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  });
</script>

</body>
</html>
