<svg xmlns="http://w3.org" viewBox="0 0 450 1200" width="100%" height="100%" preserveAspectRatio="none">
  <!-- Definition of a single repeating mountain bike tire tread segment -->
  <defs>
    <g id="mtb-tread-segment">
      <!-- Center Knobs (Paired blocks with a central water channel gap) -->
      <rect x="-7" y="-6" width="5.5" height="3" rx="0.5" fill="#F28C0F" />
      <rect x="1.5" y="-6" width="5.5" height="3" rx="0.5" fill="#F28C0F" />
      
      <!-- Alternate Center Knobs (Slightly offset wide traction bar) -->
      <rect x="-4" y="1" width="8" height="2.5" rx="0.5" fill="#F28C0F" />
      
      <!-- Side Cornering Lugs (Aggressive square outer blocks) -->
      <rect x="-14" y="-4" width="4" height="4" rx="0.5" fill="#F28C0F" transform="skewY(10)" />
      <rect x="10" y="-4" width="4" height="4" rx="0.5" fill="#F28C0F" transform="skewY(-10)" />
      
      <!-- Intermediate Transition Knobs -->
      <rect x="-9" y="2" width="2" height="2" rx="0.2" fill="#F28C0F" />
      <rect x="7" y="2" width="2" height="2" rx="0.2" fill="#F28C0F" />
    </g>

    <!-- Trail paths carefully compressed to stay cleanly within narrow mobile screens (0 to 450px width) -->
    <g id="mobile-optimized-tracks">
      <!-- Track 1: Tight sweeping singletrack snaking down the page -->
      <path id="mobile-path1" d="M 120,-50 Q 320,150 100,400 T 350,850 T 80,1250" fill="none" />
      
      <!-- Track 2: Intersecting erratic crossover line mimicking a second rider -->
      <path id="mobile-path2" d="M 330,-50 C 60,200 400,350 180,650 C 40,850 380,1000 150,1250" fill="none" />
    </g>
  </defs>

  <!-- Scaled Dirt Splatters positioned to accent the narrow layout margins -->
  <circle cx="80" cy="120" r="1.5" fill="#F28C0F" opacity="0.6"/>
  <circle cx="90" cy="130" r="0.8" fill="#F28C0F" opacity="0.4"/>
  <circle cx="360" cy="520" r="2" fill="#F28C0F" opacity="0.5"/>
  <circle cx="350" cy="535" r="1" fill="#F28C0F" opacity="0.7"/>
  <circle cx="110" cy="940" r="1.8" fill="#F28C0F" opacity="0.5"/>

  <!-- ================= PASS 1: MOBILE TRAIL 1 ================= -->
  <text font-size="1">
    <textPath href="#mobile-path1" startOffset="0%" spacing="exact">
      <!-- Repeated tread stamps closer together for smaller screens -->
      <tspan dy="0"><tref href="#mtb-tread-segment"/></tspan>
      <tspan dx="13"><tref href="#mtb-tread-segment"/></tspan>
      <tspan dx="13"><tref href="#mtb-tread-segment"/></tspan>
